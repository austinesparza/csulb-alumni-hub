::-webkit-scrollbar-thumb { background: rgba(26,32,8,0.12); border-radius: 3px; }

}
.leaflet-container { font-family: 'Quicksand', sans-serif !important; border-radius: 12px; }
.leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(26,32,8,0.15); border: 1px solid #EDEDE8; padding: 0; }
.leaflet-popup-content { margin: 0; font-family: 'Quicksand', sans-serif; min-width: 200px; }
.leaflet-popup-tip-container { display: none; }
.leaflet-control-zoom a { font-family: sans-serif; border-radius: 6px !important; }
.leaflet-control-attribution { font-size: 9px; opacity: 0.5; }
main.map-active { overflow: hidden !important; }
